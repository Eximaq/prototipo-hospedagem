name: Sincronizar disponibilidade e validar build

on:
  workflow_dispatch:
  schedule:
    # Uma vez por hora, em minuto deslocado para evitar o pico do início da hora.
    - cron: "17 * * * *"

concurrency:
  group: availability-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CASA_TURQUESA_ICAL_URL: ${{ secrets.CASA_TURQUESA_ICAL_URL }}
      CASA_CORAIS_ICAL_URL: ${{ secrets.CASA_CORAIS_ICAL_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Sincronizar calendários privados
        run: npm run availability:sync

      - name: Gerar site estático
        run: npm run build
